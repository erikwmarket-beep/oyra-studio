# Pubblica automaticamente il sito a ogni push sul branch main.
#  1. ricostruisce le pagine con build.py
#  2. pubblica la cartella site/ sul branch "deploy"
#     -> Hostinger (hPanel → Avanzate → Git) è collegato a quel branch con il deploy automatico
#  3. (facoltativo) carica site/ anche via FTP, solo se esiste il secret FTP_SERVER
#
# Per l'FTP servono in Settings → Secrets and variables → Actions:
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variable:  FTP_SERVER_DIR  (es. public_html/ , con la barra finale)
#   Variable facoltativa: FTP_PROTOCOL = ftp se ftps non funziona
name: Deploy su Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Costruisci il sito
        run: python3 build.py

      - name: Controlla i file generati
        run: |
          test -f site/index.html
          test -f site/assets/oyra.css
          test -f site/.htaccess
          ls -la site

      - name: Pubblica sul branch deploy (per Hostinger Git)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./site
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Sito pubblicato da ${{ github.sha }}'

      - name: Carica su Hostinger via FTP (facoltativo)
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: 21
          local-dir: ./site/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
