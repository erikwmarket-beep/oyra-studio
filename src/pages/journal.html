  <section class="phero cipria wrap" data-header="dark">
    <svg class="star" data-spin="140" viewBox="0 0 500 564" aria-hidden="true" style="color:var(--rosso);opacity:.9"><use href="#oyra-star"/></svg>
    <div class="top mono page-in"><span class="eyebrow"><svg viewBox="0 0 500 564" aria-hidden="true"><use href="#oyra-star"/></svg>Journal</span><span>Note dallo studio</span></div>

        <div class="filters" role="group" aria-label="Filtra gli articoli">
          <button type="button" aria-pressed="true" data-jfilter="all">Tutti</button>

          <button type="button" aria-pressed="false" data-jfilter="Web">Web</button>
        </div>
      </div>
    </div>
